<!doctype html>
<html lang="en">
<!-- Ticketr: conductor ETM prototype. The device screen is 360 x 720 dp, framed as a phone. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ticketr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="devcol">
    <div class="fit" id="fit"><div class="bezel" id="bezel">
      <i class="hw hw-act"></i><i class="hw hw-vup"></i><i class="hw hw-vdn"></i><i class="hw hw-pwr"></i>
      <div class="scr" id="scr">
        <div class="view" id="v-start"></div>
        <div class="view" id="v-core">
          <div class="card0"></div>
          <div class="status" id="status"></div>
          <div class="strip" id="strip"></div>
          <div class="form" id="form"></div>
          <div class="issue" id="issue"></div>
        </div>
        <div class="view" id="v-end"></div>
        <div class="ov" id="ov"></div>
      </div>
    </div></div>
  </div>

  <aside class="bench" aria-label="Test bench">
    <section class="card" id="reachcard">
      <div class="ch"><h2>Reach map</h2></div>
      <div class="seg b-full" id="sg-reach" role="group" aria-label="Reach map grip">
        <button data-v="off" aria-pressed="true">Off</button><button data-v="right" aria-pressed="false">Right hand</button><button data-v="left" aria-pressed="false">Left hand</button><button data-v="two" aria-pressed="false">Both hands</button>
      </div>
      <div class="rinfo" id="rinfo" hidden>
        <div class="legend"><span class="b-key e">Easy</span><span class="b-key s">Stretch</span><span class="b-key h">Hard</span></div>
      </div>
    </section>

    <section class="card">
      <div class="ch"><h2>Edge cases</h2></div>
      <div class="ctl"><span class="cl">Network</span>
        <div class="seg" id="sg-net" role="group" aria-label="Network"><button data-v="on" aria-pressed="true">On</button><button data-v="off" aria-pressed="false">Off</button></div></div>
      <div class="ctl"><span class="cl">Printer</span>
        <div class="seg" id="sg-paper" role="group" aria-label="Printer paper"><button data-v="ok" aria-pressed="true">Paper OK</button><button data-v="low" aria-pressed="false">Low</button><button data-v="out" aria-pressed="false">Out</button></div></div>
      <div class="ctl"><span class="cl">Battery</span>
        <div class="seg" id="sg-batt" role="group" aria-label="Battery"><button data-v="ok" aria-pressed="true">82%</button><button data-v="low" aria-pressed="false">15%</button></div></div>
      <div class="ctl b-col"><span class="cl">UPI payment</span>
        <div class="pair"><button class="btn alt" id="payNow" disabled>Passenger pays</button><button class="btn alt" id="payFail" disabled>Payment fails</button></div></div>
      <div class="ctl b-col"><span class="cl">Power loss</span>
        <button class="btn alt wide" id="simRestart">Simulate restart</button></div>
    </section>

    <section class="card" id="tapecard">
      <div class="ch"><h2>Printed tickets</h2></div>
      <div class="tape" id="tape"><p class="note">Nothing printed yet.</p></div>
    </section>
  </aside>
</div>

<script src="script.js"></script>
</body>
</html>
